[package]
name = "mutter"
version = "0.1.0"
authors = ["Patrick Oberholzer <patrickoberholzer08@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.8.0-alpha.0", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
futures = "0.3"
# Client-side clock (used only on wasm).
js-sys = "0.3"

# Server-only dependencies, pulled in by the `server` feature.
tokio = { version = "1.53", features = ["full"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
tower-sessions = { version = "0.15", optional = true }
anyhow = { version = "1", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:sqlx",
    "dep:argon2",
    "dep:rand",
    "dep:tower-sessions",
    "dep:anyhow",
]
